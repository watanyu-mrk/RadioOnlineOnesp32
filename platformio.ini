; Guition ESP32-S3-4848S040 (ESP32-S3-WROOM-1 N16R8)
; Phase 2: display + touch hardware test
;
; board = esp32-s3-devkitc-1 is used as the base definition because PlatformIO
; has no native 4848S040 board; flash/PSRAM settings are overridden below.

[platformio]
default_envs = esp32-s3-4848s040

[env:esp32-s3-4848s040]
platform = espressif32@55.3.312
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
upload_speed = 921600

; 16 MB QIO flash + 8 MB OPI PSRAM (N16R8)
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; src/audio_test/ and src/stream_test/ have their own setup()/loop(), and the modular
; firmware (audio/ display/ radio/ storage/ ui/ web/) only belongs to the stream_test env:
; keep every alternative sketch and module out of this build.
build_src_filter = +<*> -<audio_test/> -<stream_test/> -<audio/> -<display/> -<radio/> -<storage/> -<ui/> -<web/>

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  moononournation/GFX Library for Arduino@1.6.9

; ----------------------------------------------------------------------------
; Phase 3 audio path test (no Wi-Fi, no radio). Build/flash with:
;   python -m platformio run -e audio_test -t upload
; ----------------------------------------------------------------------------
[env:audio_test]
platform = espressif32@55.3.312
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_src_filter = +<audio_test/>

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0

; ----------------------------------------------------------------------------
; Phase 3b stream test: Wi-Fi + MP3 decode to the same I2S bus.
; Credentials live in include/secrets.h (gitignored).
;   python -m platformio run -e stream_test -t upload
; ----------------------------------------------------------------------------
[env:stream_test]
platform = espressif32@55.3.312
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; The sketch is only the wiring; the modules live in their own src/ folders.
; ui/legacy holds the previous Arduino_GFX faceplate (kept as a rollback reference, not
; compiled). The live UI is src/ui/lv_ui.cpp on LVGL.
build_src_filter = +<stream_test/> +<audio/> +<display/> +<radio/> +<storage/> +<ui/> -<ui/legacy/> +<web/>

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  ; lv_conf.h lives in include/. LVGL is built as a library dependency, and library
  ; builds do not get the project include dir automatically, so pass it explicitly
  ; (one argv token, so the space in the project path is fine).
  -DLV_CONF_INCLUDE_SIMPLE
  -I$PROJECT_DIR/include

; Registry build 2.3.0 does not compile against Arduino-ESP32 3.3.12
; (min(uint32_t, size_t) ambiguity in Audio.cpp), so pin the upstream tag.
; UI is LVGL 8.3: the last line that matches the Arduino_GFX v8 example and the
; lv_disp_draw_buf / draw-event API this port uses.
lib_deps =
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
  moononournation/GFX Library for Arduino@1.6.9
  lvgl/lvgl@8.3.11
